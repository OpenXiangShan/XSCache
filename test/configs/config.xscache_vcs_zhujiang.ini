# Cohestra VCS traffic smoke config for TestTop_L2ZhuJiang
# (cohestra_vcs VCS/DPI harness with the test/scripts/common/xscache_vcs_top.sv
# wrapper, driver test/scripts/zhujiang/boot_zhujiang.sh vcs-build/vcs-run).
# Copy of test/configs/config.xscache_zhujiang_fuzz.ini with waveform.type=fsdb
# (VCS harness: vcd/fsdb only).
# (4x Oceanus L2 behind the ZhuJiang CHI interconnect; ZhuJiang HN-F -> SN ->
# axi_m0 -> harness AXI memory behind the CHI RN-F links).
#
# Full path: FuzzARI -> Taurus upstream (CCHI) -> L2 -> CHI RN-F -> ZhuJiang
# CC socket -> ring -> HN-F bank {0x00,0x10,0x28,0x40} (address bit 12) ->
# SN 0x38 (AxiBridge) -> axi_m0 -> harness AXIMemory.
#
# Address map constraints (see test/configs/config.xscache_zhujiang.ini):
#   0x8000_0000 - 0x8FFF_FFFF   harness memory window — used below as four
#                               disjoint 16 MB windows, one per L2,
#                               deliberately with no cross-L2 line sharing
#                               for this first traffic smoke
#   >= 0x1000_0000_0000         nonzero ZhuJiang chip/cluster ID (no device
#                               answers — avoid)

[log]
verbose                         = 0

[verilated]
waveform.enable                 = 0
waveform.path                   =
; waveform.type must match the build's COHESTRA_V3_WAVEFORM_FORMAT (fst or vcd)
waveform.type                   = fsdb

[root]
; Reset asserted from simulation start (preamble 0) so the DUT's RegInit
; state — and the assertions depending on it — are valid from cycle 0; the
; SECOND pulse re-exercises reset after unreset runtime (also covering the
; ZhuJiang ring's two-phase reset protocol).
reset_preamble                  = 0
reset_repeat                    = 2
reset_cycles                    = 8192
upstream.type1.nodeid           = 0, 1, 2, 3
upstream.type1.inflight.evt     = 16
upstream.type1.inflight.snp     = 16
upstream.type1.inflight.req     = 16
upstream.type1.inflight         = 32
upstream.type1.buffer.evt       = 4
upstream.type1.buffer.req       = 4
upstream.type1.buffer.rsp       = 4
upstream.type1.buffer.dat       = 4

stimulator.0                    = FuzzARI
stimulator.0.enable             = 1
stimulator.0.upstreams.type1    = 0

stimulator.1                    = FuzzARI
stimulator.1.enable             = 1
stimulator.1.upstreams.type1    = 1

stimulator.2                    = FuzzARI
stimulator.2.enable             = 1
stimulator.2.upstreams.type1    = 2

stimulator.3                    = FuzzARI
stimulator.3.enable             = 1
stimulator.3.upstreams.type1    = 3

stimulator.4                    =
stimulator.4.enable             = 0

stimulator.5                    =
stimulator.5.enable             = 0

stimulator.6                    =
stimulator.6.enable             = 0

stimulator.7                    =
stimulator.7.enable             = 0

[stimulator.0]
fuzz.ari.seed                   = 1000
fuzz.ari.interval               = 4000
fuzz.ari.target                 = 64
fuzz.ari.startup                = 8
fuzz.ari.maximum.cycle          = 0
fuzz.ari.memory.enable          = 1
fuzz.ari.memory.start           = 2147483648
fuzz.ari.memory.end             = 2164260864
fuzz.ari.cmo.enable             = 0
fuzz.ari.range.tag              = 32
fuzz.ari.range.set              = 32
fuzz.ari.range.alias            = 4

[stimulator.1]
fuzz.ari.seed                   = 2000
fuzz.ari.interval               = 4000
fuzz.ari.target                 = 64
fuzz.ari.startup                = 8
fuzz.ari.maximum.cycle          = 0
fuzz.ari.memory.enable          = 1
fuzz.ari.memory.start           = 2164260864
fuzz.ari.memory.end             = 2181038080
fuzz.ari.cmo.enable             = 0
fuzz.ari.range.tag              = 32
fuzz.ari.range.set              = 32
fuzz.ari.range.alias            = 4

[stimulator.2]
fuzz.ari.seed                   = 3000
fuzz.ari.interval               = 4000
fuzz.ari.target                 = 64
fuzz.ari.startup                = 8
fuzz.ari.maximum.cycle          = 0
fuzz.ari.memory.enable          = 1
fuzz.ari.memory.start           = 2181038080
fuzz.ari.memory.end             = 2197815296
fuzz.ari.cmo.enable             = 0
fuzz.ari.range.tag              = 32
fuzz.ari.range.set              = 32
fuzz.ari.range.alias            = 4

[stimulator.3]
fuzz.ari.seed                   = 4000
fuzz.ari.interval               = 4000
fuzz.ari.target                 = 64
fuzz.ari.startup                = 8
fuzz.ari.maximum.cycle          = 0
fuzz.ari.memory.enable          = 1
fuzz.ari.memory.start           = 2197815296
fuzz.ari.memory.end             = 2214592512
fuzz.ari.cmo.enable             = 0
fuzz.ari.range.tag              = 32
fuzz.ari.range.set              = 32
fuzz.ari.range.alias            = 4

# Harness AXI memory window behind axi_m0 (ZhuJiang SN AxiBridge); must cover
# every fuzz window above.
[memory]
start                           = 2147483648
end                             = 2415919103

# First-bring-up timeouts: keep progress.timeout comfortably above the ZhuJiang
# ring's two-phase reset and any PoS backpressure stall.
[watchdog]
enable                          = 1
progress.timeout                = 100000
xact.timeout                    = 20000
fail.on.timeout                 = 1
dump.limit                      = 8

[monitor]
enable                          = 1
fail.on.mismatch                = 1

[profiler]
enable                          = 1

[simperf]
enable                          = 1
interval.cycles                 = 100000
interval.seconds                = 0

[cchi]
verbose                         = 0

# CLog.B export of the 4 RN-F AMBA CHI links (via the mon_chi_rn* monitor
# taps). enable=1 requires path + rnf.nodeid.* + the full ring topo map
# (DMT CompData can carry SN SrcIDs). test/scripts/zhujiang/boot_zhujiang.sh CLOGB=1
# regenerates these sections from build/zhujiang/zj_topology.txt; the values
# below mirror the default 4-L2 topology.
[clogb]
enable                          = 0
path                            = zhujiang.clogb
rnf.nodeid.0                    = 8
rnf.nodeid.1                    = 24
rnf.nodeid.2                    = 48
rnf.nodeid.3                    = 72

# Full ZhuJiang ring node map (default TestTop_L2ZhuJiang 4-L2 topology;
# authoritative source: build/zhujiang/zj_topology.txt).
[clogb.topo]
0                               = hnf
8                               = rnf
16                              = hnf
24                              = rnf
32                              = hni
40                              = hnf
48                              = rnf
56                              = snf
64                              = hnf
72                              = rnf
80                              = mn
