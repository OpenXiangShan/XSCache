# Cohestra V3 traffic smoke config for XSCache TestTop_L2Avocado
# (4x Oceanus L2 as the Avocado DUT; 3x2 Mesh + SBSX -> harness AXI
# memory behind the CHI RN-F links).
#
# Full path: FuzzARI -> Taurus upstream (CCHI) -> L2 -> CHI RN-F -> mesh
# RN-SAM -> hashed HN-F {40,36,8,68} -> 2-SN striping -> SBSX 4/72 ->
# axi_m0/axi_m1 (harness memory).
#
# Address map constraints from the Avocado boot script (see
# test/scripts/avocado/boot_avocado.sh and the package's boot README):
#   0x0 - 0x0FFF_FFFF   safe DRAM window (SCG0, hashed) — used below as four
#                       disjoint 64 MB windows, one per L2, deliberately with
#                       no cross-L2 line sharing for this first traffic smoke
#   0x1000_0000 - 0x1FFF_FFFF   MMIO hole -> parked PERIPH_AXI (HANGS — avoid)
#   0x4000_0000/0x5000_0000     DMC/DSU strap windows (avoid)
#   0x6000_0000 - 0x6FFF_FFFF   CFGM config space (register space, not DRAM)
#   >= 0x2_0000_0000    outside SCG0 -> default node (parked — avoid)

[log]
verbose                         = 0

[verilated]
waveform.enable                 = 0
waveform.path                   =
; waveform.type must match the build's COHESTRA_V3_WAVEFORM_FORMAT (fst or vcd)
waveform.type                   = fst

[root]
; Reset asserted from simulation start (preamble 0) so the DUT's RegInit
; state — and the assertions depending on it — are valid from cycle 0; the
; SECOND pulse then provides the reset-assertion edge after unreset runtime
; that the mesh PUB fabric requires (replacing the 1024-cycle preamble).
reset_preamble                  = 0
reset_repeat                    = 2
reset_cycles                    = 8192
upstream.type1.nodeid           = 0, 1, 2, 3
upstream.type1.inflight.evt     = 16
upstream.type1.inflight.snp     = 16
upstream.type1.inflight.req     = 16
upstream.type1.inflight         = 32
upstream.type1.buffer.evt       = 4
upstream.type1.buffer.req       = 4
upstream.type1.buffer.rsp       = 4
upstream.type1.buffer.dat       = 4

stimulator.0                    = FuzzARI
stimulator.0.enable             = 1
stimulator.0.upstreams.type1    = 0

stimulator.1                    = FuzzARI
stimulator.1.enable             = 1
stimulator.1.upstreams.type1    = 1

stimulator.2                    = FuzzARI
stimulator.2.enable             = 1
stimulator.2.upstreams.type1    = 2

stimulator.3                    = FuzzARI
stimulator.3.enable             = 1
stimulator.3.upstreams.type1    = 3

stimulator.4                    =
stimulator.4.enable             = 0

stimulator.5                    =
stimulator.5.enable             = 0

stimulator.6                    =
stimulator.6.enable             = 0

stimulator.7                    =
stimulator.7.enable             = 0

[stimulator.0]
fuzz.ari.seed                   = 1000
fuzz.ari.interval               = 4000
fuzz.ari.target                 = 64
fuzz.ari.startup                = 8
fuzz.ari.maximum.cycle          = 0
fuzz.ari.memory.enable          = 1
fuzz.ari.memory.start           = 0
fuzz.ari.memory.end             = 67108864
fuzz.ari.cmo.enable             = 0
fuzz.ari.range.tag              = 32
fuzz.ari.range.set              = 32
fuzz.ari.range.alias            = 4

[stimulator.1]
fuzz.ari.seed                   = 2000
fuzz.ari.interval               = 4000
fuzz.ari.target                 = 64
fuzz.ari.startup                = 8
fuzz.ari.maximum.cycle          = 0
fuzz.ari.memory.enable          = 1
fuzz.ari.memory.start           = 67108864
fuzz.ari.memory.end             = 134217728
fuzz.ari.cmo.enable             = 0
fuzz.ari.range.tag              = 32
fuzz.ari.range.set              = 32
fuzz.ari.range.alias            = 4

[stimulator.2]
fuzz.ari.seed                   = 3000
fuzz.ari.interval               = 4000
fuzz.ari.target                 = 64
fuzz.ari.startup                = 8
fuzz.ari.maximum.cycle          = 0
fuzz.ari.memory.enable          = 1
fuzz.ari.memory.start           = 134217728
fuzz.ari.memory.end             = 201326592
fuzz.ari.cmo.enable             = 0
fuzz.ari.range.tag              = 32
fuzz.ari.range.set              = 32
fuzz.ari.range.alias            = 4

[stimulator.3]
fuzz.ari.seed                   = 4000
fuzz.ari.interval               = 4000
fuzz.ari.target                 = 64
fuzz.ari.startup                = 8
fuzz.ari.maximum.cycle          = 0
fuzz.ari.memory.enable          = 1
fuzz.ari.memory.start           = 201326592
fuzz.ari.memory.end             = 268435456
fuzz.ari.cmo.enable             = 0
fuzz.ari.range.tag              = 32
fuzz.ari.range.set              = 32
fuzz.ari.range.alias            = 4

# Harness AXI memory window behind the SBSX masters (axi_m0/axi_m1): match
# the hashed DRAM window above.
[memory]
start                           = 0
end                             = 268435456

# Boot warm-up idles 25000 cycles on purpose; keep the progress timeout well
# above that.
[watchdog]
enable                          = 1
progress.timeout                = 100000
xact.timeout                    = 20000
fail.on.timeout                 = 1
dump.limit                      = 8

[monitor]
enable                          = 1
fail.on.mismatch                = 1

[profiler]
enable                          = 1

[simperf]
enable                          = 1
interval.cycles                 = 100000
interval.seconds                = 0

[boot]
sequencer                       = Avocado
avocado.axi_master              = 0

[cchi]
verbose                         = 0

# CLog.B export of the 4 RN-F AMBA CHI links (via the mon_chi_rn* monitor
# taps; writes happen in the harness through the CHI monitor interface).
# enable=1 requires path + rnf.nodeid.* + the full mesh topo below.
# Record time unit = harness ticks (2 ticks per DUT clock).
# test/scripts/avocado/boot_avocado.sh CLOGB=1 regenerates these sections itself.
[clogb]
enable                          = 0
path                            = avocado.clogb
rnf.nodeid.0                    = 32
rnf.nodeid.1                    = 64
rnf.nodeid.2                    = 12
rnf.nodeid.3                    = 44

# Full avocado mesh node map
[clogb.topo]
0                               = hni
4                               = snf
8                               = hnf
12                              = rnf
32                              = rnf
36                              = hnf
40                              = hnf
44                              = rnf
64                              = rnf
68                              = hnf
72                              = snf
76                              = rni
