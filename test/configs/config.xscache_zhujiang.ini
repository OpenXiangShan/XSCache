# Cohestra V3 idle smoke config for TestTop_L2ZhuJiang
# (4x Oceanus L2 behind the ZhuJiang CHI interconnect; ZhuJiang HN-F -> SN ->
# axi_m0 -> harness AXI memory). No stimulators: reset + idle only.
#
# Full path (traffic configs): FuzzARI -> Taurus upstream (CCHI) -> L2 ->
# CHI RN-F -> ZhuJiang CC socket -> ring -> HN-F (dongjiang) -> SN
# (AxiBridge) -> axi_m0 -> harness AXIMemory.
#
# Address map: the SN node carries the default (match-everything) addrSets,
# so every non-device address lands on the memory window below. Keep all
# windows inside [memory] start/end and below 0x1000_0000_0000 (the top 4
# address bits are the ZhuJiang chip/cluster ID and must stay 0).

[log]
verbose                         = 0

[verilated]
waveform.enable                 = 0
waveform.path                   =
; waveform.type must match the build's COHESTRA_V3_WAVEFORM_FORMAT (fst or vcd)
waveform.type                   = fst

[root]
; Reset asserted from simulation start (preamble 0) so the DUT's RegInit
; state — and the assertions depending on it — are valid from cycle 0; the
; SECOND pulse re-exercises reset after unreset runtime (also covering the
; ZhuJiang ring's two-phase reset protocol).
reset_preamble                  = 0
reset_repeat                    = 2
reset_cycles                    = 8192
; One CCHI node ID per present cchi_t1p{P} port — must match the DUT's
; per-L2 Type-1 NIDs (--cchi-nids, default 0,1,2,3).
upstream.type1.nodeid           = 0, 1, 2, 3
upstream.type1.inflight.evt     = 16
upstream.type1.inflight.snp     = 16
upstream.type1.inflight.req     = 16
upstream.type1.inflight         = 32
upstream.type1.buffer.evt       = 4
upstream.type1.buffer.req       = 4
upstream.type1.buffer.rsp       = 4
upstream.type1.buffer.dat       = 4

stimulator.0                    =
stimulator.0.enable             = 0

stimulator.1                    =
stimulator.1.enable             = 0

stimulator.2                    =
stimulator.2.enable             = 0

stimulator.3                    =
stimulator.3.enable             = 0

stimulator.4                    =
stimulator.4.enable             = 0

stimulator.5                    =
stimulator.5.enable             = 0

stimulator.6                    =
stimulator.6.enable             = 0

stimulator.7                    =
stimulator.7.enable             = 0

# Harness AXI memory window behind axi_m0 (ZhuJiang SN AxiBridge).
[memory]
start                           = 2147483648
end                             = 2415919103

[watchdog]
enable                          = 1
progress.timeout                = 100000
xact.timeout                    = 20000
fail.on.timeout                 = 1
dump.limit                      = 8

[monitor]
enable                          = 1
fail.on.mismatch                = 1

[profiler]
enable                          = 1

[simperf]
enable                          = 1
interval.cycles                 = 100000
interval.seconds                = 0

[cchi]
verbose                         = 0
