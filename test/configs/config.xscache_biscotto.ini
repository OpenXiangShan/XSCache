# Cohestra V3 boot-only smoke config for XSCache TestTop_L2Biscotto
# (3x Oceanus L2 as the Biscotto DUT; CHI RN-F links mated to the
# 2x2 Mesh render's RNFEESAM ports 4/12/44, LDID order).
#
# No stimulators: validates the DUT build integration, the CCHI pin contract,
# the reset preamble (the mesh needs a reset-assertion edge after unreset
# runtime; the SECOND pulse below provides it), the ~16.5k-cycle CCB FAM
# ramp (boot warm-up 25000) and the derived ~60-entry Biscotto boot script
# (write+verify through axi_s0 -> CFG_AXI). Traffic smoke lives in
# config.xscache_biscotto_fuzz.ini.

[log]
verbose                         = 1

[verilated]
waveform.enable                 = 0
waveform.path                   =
; waveform.type must match the build's COHESTRA_V3_WAVEFORM_FORMAT (fst or vcd)
waveform.type                   = fst

[root]
; Reset asserted from simulation start (preamble 0) so the DUT's RegInit
; state — and the assertions depending on it — are valid from cycle 0; the
; SECOND pulse then provides the reset-assertion edge after unreset runtime
; that the mesh PUB fabric requires (replacing the 1024-cycle preamble).
reset_preamble                  = 0
reset_repeat                    = 2
reset_cycles                    = 8192
; One Taurus upstream node per L2 CCHI Type-1 port (cchi_t1p0..2). The
; cohestra_vcs bridge presents a fixed 4-T1 Avocado-style boundary and the
; CCHI instance init requires a node ID for EVERY boundary index
; (cohestra_instance.cpp), so index 3 (parked by biscotto_vcs_top) carries
; placeholder ID 0 — duplicates are accepted (same precedent as
; config.xscache_vcs_openllc.ini) and the parked port never sees traffic.
upstream.type1.nodeid           = 0, 1, 2, 0
upstream.type1.inflight.evt     = 16
upstream.type1.inflight.snp     = 16
upstream.type1.inflight.req     = 16
upstream.type1.inflight         = 32
upstream.type1.buffer.evt       = 4
upstream.type1.buffer.req       = 4
upstream.type1.buffer.rsp       = 4
upstream.type1.buffer.dat       = 4

stimulator.0                    =
stimulator.0.enable             = 0

stimulator.1                    =
stimulator.1.enable             = 0

stimulator.2                    =
stimulator.2.enable             = 0

stimulator.3                    =
stimulator.3.enable             = 0

stimulator.4                    =
stimulator.4.enable             = 0

stimulator.5                    =
stimulator.5.enable             = 0

stimulator.6                    =
stimulator.6.enable             = 0

stimulator.7                    =
stimulator.7.enable             = 0

[boot]
sequencer                       = Biscotto
biscotto.axi_master             = 0

# No [watchdog]: the boot stage idles 25000 cycles on purpose (mesh power-up
# ramp), and this smoke bounds itself with -n instead.
[monitor]
enable                          = 1
fail.on.mismatch                = 1

[profiler]
enable                          = 1

[simperf]
enable                          = 1
interval.cycles                 = 100000
interval.seconds                = 0

[cchi]
verbose                         = 1

# CLog.B export of the 3 RN-F AMBA CHI links (via the mon_chi_rn* monitor
# taps; writes happen in the harness through the CHI monitor interface).
# enable=1 requires path + rnf.nodeid.* + the full mesh topo below.
# Record time unit = harness ticks (2 ticks per DUT clock).
# test/scripts/biscotto/boot_biscotto.sh CLOGB=1 regenerates these sections itself.
[clogb]
enable                          = 0
path                            = biscotto.clogb
rnf.nodeid.0                    = 4
rnf.nodeid.1                    = 12
rnf.nodeid.2                    = 44

# Full biscotto mesh node map
[clogb.topo]
0                               = hni
4                               = rnf
8                               = hnf
12                              = rnf
32                              = rni
36                              = snf
40                              = hnf
44                              = rnf
