# Cohestra VCS smoke config for XSCache TestTop_L2OpenLLC
# (NUM_L2=4 Oceanus L2 -> OpenLLC -> OpenNCB -> AXI4; cohestra_vcs VCS/DPI
# harness with the test/scripts/common/xscache_vcs_top.sv wrapper, driver
# test/scripts/openllc/boot_openllc.sh (vcs-build/vcs-run stages).
#
# Copy of test/configs/config.xscache.ini (the l2openllc FuzzARI smoke) with:
#   * reset asserted from simulation start ([root] reset_preamble=0 /
#     reset_repeat=2 / reset_cycles=100): RegInit-dependent assertions such
#     as the LinkLayer L-credit conservation check (xscache/chi/
#     LinkLayer.scala) are only valid when the DUT is reset from cycle 0;
#     same policy as the avocado configs (the second pulse replaces the
#     default 1024-cycle unreset preamble's reset-assertion edge — this DUT
#     has no mesh PUB fabric needing it, but the policy is kept uniform).
#   * waveform adjusted for the VCS harness: it reads the same waveform.*
#     keys but supports vcd/fsdb only (fst is rejected); fsdb requires the
#     VERDI_HOME build (boot_openllc.sh vcs-build sets it by default).
#
# Only upstream node 0 (cchi_t1p0) is driven; t1p1..3 stay idle.

[log]
verbose                         = 0

[verilated]
waveform.enable                 = 0
waveform.path                   =
; VCS harness: type must be vcd or fsdb (fst is Verilator-only)
waveform.type                   = fsdb

[root]
; Reset from simulation start (see header; matches the avocado configs).
reset_preamble                  = 0
reset_repeat                    = 2
reset_cycles                    = 100
; The DUT exposes four Type-1 ports (cchi_t1p0..3, one per L2) and the harness
; requires one upstream node per present port. Each L2's upstream table takes
; the defaults (L2UpstreamTable.defaults: its T1 client is NID 0 — see
; L2Top.scala / TestTop_L2OpenLLC.scala, no per-L2 override), and the IDs are
; per-port scoped (each port fronts an independent L2), so all four nodes take
; ID 0. Only port 0 is driven by a stimulator below; nodes 1..3 stay idle.
upstream.type1.nodeid           = 0, 0, 0, 0
upstream.type1.inflight.evt     = 16
upstream.type1.inflight.snp     = 16
upstream.type1.inflight.req     = 16
upstream.type1.inflight         = 32

stimulator.0                    = FuzzARI
stimulator.0.enable             = 1
stimulator.0.upstreams.type1    = 0

stimulator.1                    =
stimulator.1.enable             = 0

stimulator.2                    =
stimulator.2.enable             = 0

stimulator.3                    =
stimulator.3.enable             = 0

stimulator.4                    =
stimulator.4.enable             = 0

stimulator.5                    =
stimulator.5.enable             = 0

stimulator.6                    =
stimulator.6.enable             = 0

stimulator.7                    =
stimulator.7.enable             = 0

[stimulator.0]
verbose = 1
verbose.flit = 1
verbose.xact = 1
verbose.internal = 0
verbose.backpressure = 0
verbose.port.busy = 0

fuzz.ari.seed                   = 1000
fuzz.ari.interval               = 4000
fuzz.ari.target                 = 1
fuzz.ari.startup                = 8
fuzz.ari.maximum.cycle          = 0
fuzz.ari.memory.enable          = 1
fuzz.ari.memory.start           = 2147483648
fuzz.ari.memory.end             = 2684354560
fuzz.ari.cmo.enable             = 0
fuzz.ari.range.tag              = 32
fuzz.ari.range.set              = 32
fuzz.ari.range.alias            = 4

# AXI memory model window (DUT axi_m0_*): match the fuzz window.
[memory]
start                           = 2147483648
end                             = 2684354560

# Fail fast on deadlock/livelock rather than burning the whole cycle budget.
[watchdog]
enable                          = 1
progress.timeout                = 20000
xact.timeout                    = 10000
fail.on.timeout                 = 1
dump.limit                      = 8

[monitor]
enable                          = 1
fail.on.mismatch                = 1

[profiler]
enable                          = 1

[simperf]
enable                          = 1
interval.cycles                 = 100000
interval.seconds                = 0

[cchi]
verbose                         = 1
