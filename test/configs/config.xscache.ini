# Cohestra V3 smoke config for XSCache TestTop_L2OpenLLC
# (Oceanus L2 x1 -> OpenLLC -> OpenNCB -> AXI4, single Type-1 port cchi_t1p0).
# Expect imperfect results: this is a first bring-up wiring check.

[log]
verbose                         = 0

[verilated]
waveform.enable                 = 0
waveform.path                   =
; waveform.type must match the build's COHESTRA_V3_WAVEFORM_FORMAT (fst or vcd)
waveform.type                   = fst

[root]
; Reset asserted from simulation start (preamble 0) so the DUT's RegInit
; state — and the assertions depending on it (e.g. the L-credit conservation
; check in xscache/chi/LinkLayer.scala) — are valid from cycle 0; the second
; pulse matches the repo-wide smoke convention.
reset_preamble                  = 0
reset_repeat                    = 2
; The DUT exposes exactly one Type-1 port (cchi_t1p0); L2Top hardcodes the
; upstream NID to 0, so the single Taurus node must take ID 0.
upstream.type1.nodeid           = 0
upstream.type1.inflight.evt     = 16
upstream.type1.inflight.snp     = 16
upstream.type1.inflight.req     = 16
upstream.type1.inflight         = 32

stimulator.0                    = FuzzARI
stimulator.0.enable             = 1
stimulator.0.upstreams.type1    = 0

stimulator.1                    =
stimulator.1.enable             = 0

stimulator.2                    =
stimulator.2.enable             = 0

stimulator.3                    =
stimulator.3.enable             = 0

stimulator.4                    =
stimulator.4.enable             = 0

stimulator.5                    =
stimulator.5.enable             = 0

stimulator.6                    =
stimulator.6.enable             = 0

stimulator.7                    =
stimulator.7.enable             = 0

[stimulator.0]
verbose = 1
verbose.flit = 1
verbose.xact = 1
verbose.internal = 0
verbose.backpressure = 0
verbose.port.busy = 0

fuzz.ari.seed                   = 1000
fuzz.ari.interval               = 4000
fuzz.ari.target                 = 1
fuzz.ari.startup                = 8
fuzz.ari.maximum.cycle          = 0
fuzz.ari.memory.enable          = 1
fuzz.ari.memory.start           = 2147483648
fuzz.ari.memory.end             = 2684354560
fuzz.ari.cmo.enable             = 0
fuzz.ari.range.tag              = 32
fuzz.ari.range.set              = 32
fuzz.ari.range.alias            = 4

# AXI memory model window (DUT axi_m0_*): match the fuzz window.
[memory]
start                           = 2147483648
end                             = 2684354560

# Fail fast on deadlock/livelock rather than burning the whole cycle budget.
[watchdog]
enable                          = 1
progress.timeout                = 20000
xact.timeout                    = 10000
fail.on.timeout                 = 1
dump.limit                      = 8

[monitor]
enable                          = 1
fail.on.mismatch                = 1

[profiler]
enable                          = 1

[simperf]
enable                          = 1
interval.cycles                 = 100000
interval.seconds                = 0

[cchi]
verbose                         = 1
