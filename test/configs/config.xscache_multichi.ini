# Cohestra V3 idle smoke config for XSCache TestTop_L2MultiCHI
# (Oceanus L2 x1, CCHI upstream on cchi_t1p0, CHI RN-F link exported as pins).
#
# Zero traffic: the exported CHI links have no home node behind them in this
# top, so any request that misses would deadlock by construction. This smoke
# validates build integration, the CCHI pin contract, reset/boot and a clean
# idle (watchdog/monitor quiet) only.

[log]
verbose                         = 0

[verilated]
waveform.enable                 = 0
waveform.path                   =
; waveform.type must match the build's COHESTRA_V3_WAVEFORM_FORMAT (fst or vcd)
waveform.type                   = fst

[root]
; Reset asserted from simulation start (preamble 0) so the DUT's RegInit
; state — and the assertions depending on it (e.g. the L-credit conservation
; check in LinkLayer) — are valid from cycle 0; the repeated pulse matches
; the avocado configs' scheme (no mesh here, so short cycles suffice).
reset_preamble                  = 0
reset_repeat                    = 2
reset_cycles                    = 100
; The DUT exposes one Type-1 port per L2 (cchi_t1p0 here); default CCHI
; upstream NID is 0 (see --cchi-t1-nids).
upstream.type1.nodeid           = 0
upstream.type1.inflight.evt     = 16
upstream.type1.inflight.snp     = 16
upstream.type1.inflight.req     = 16
upstream.type1.inflight         = 32

stimulator.0                    =
stimulator.0.enable             = 0

stimulator.1                    =
stimulator.1.enable             = 0

stimulator.2                    =
stimulator.2.enable             = 0

stimulator.3                    =
stimulator.3.enable             = 0

stimulator.4                    =
stimulator.4.enable             = 0

stimulator.5                    =
stimulator.5.enable             = 0

stimulator.6                    =
stimulator.6.enable             = 0

stimulator.7                    =
stimulator.7.enable             = 0

# Fail fast on deadlock/livelock rather than burning the whole cycle budget.
[watchdog]
enable                          = 1
progress.timeout                = 20000
xact.timeout                    = 10000
fail.on.timeout                 = 1
dump.limit                      = 8

[monitor]
enable                          = 1
fail.on.mismatch                = 1

[profiler]
enable                          = 1

[simperf]
enable                          = 1
interval.cycles                 = 100000
interval.seconds                = 0

[cchi]
verbose                         = 1
